name: CI

on:
  push:
    branches: [main]
    # Docs-only changes don't need the three-platform matrix.
    paths-ignore: ["**.md", "docs/**", "LICENSE*"]
  # Every pull request runs: main requires these checks, and a skipped run
  # never reports, which would block a docs-only PR forever.
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Frontend — install, lint, typecheck, build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Rust — format
        run: cargo fmt --all -- --check

      - name: Rust — clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust — tests
        run: cargo test --workspace

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit (high and above fail the build)
        run: npm audit --audit-level=high

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny (advisories, licenses, sources)
        run: cargo deny check
