name: Release

# Pushing a tag `vX.Y.Z` builds the installers on the three platforms and
# attaches them, with their SHA-256 checksums, to a DRAFT GitHub release.
# A human reviews the draft and publishes it.
# Running it by hand (workflow_dispatch) builds, signs and checks the same
# files without creating the release: a dry run that publishes nothing.
# Either way, the Linux and Windows packages are installed and started on
# clean runners first, and a package that does not start stops the release.
#
# Update signing (ADR 0004): no machine that ran the build sees the signing
# key. The `sign` job starts clean, installs the Tauri CLI from the lockfile
# without install scripts, signs the downloaded packages, checks them against
# the public key built into the app and uploads only the signatures. Its
# secrets live in the `release` environment, open only to `main` and `v*` tags.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu: the binary links against its glibc and
          # so runs on every newer distribution.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the next step needs main's history

      # Catches a tag made on the wrong commit by mistake. A tag made on purpose
      # on a branch could remove this step: the tag ruleset (admins only) covers that.
      - name: The tag is on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} points to a commit that is not on main"
            exit 1
          fi

      - name: The tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match app version ${version}"
            exit 1
          fi

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential rpm

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Bundle
        run: |
          npm ci
          npm run bundle -- --target ${{ matrix.target }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          bundle="target/${{ matrix.target }}/release/bundle"
          find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          # The macOS updater swaps the whole app: a tarball of the bundle, named
          # per target because both macOS targets build "Cortex.app".
          if [ -d "$bundle/macos/Cortex.app" ]; then
            COPYFILE_DISABLE=1 tar -czf "out/Cortex_${{ matrix.target }}.app.tar.gz" \
              -C "$bundle/macos" Cortex.app
          fi
          ls -l out
          test -n "$(ls -A out)"

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # Nobody installs these packages by hand before a release, so the workflow
  # does: each one is installed on a clean runner, started, and asked for a
  # decision through the relay it ships (scripts/smoke-test.sh).
  smoke:
    name: Install and start (${{ matrix.package }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # A newer Ubuntu than the one that built them.
          - { package: deb, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { package: AppImage, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { package: nsis, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { package: msi, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: installers-${{ matrix.target }}
          path: out

      # No desktop here. Without a session bus of its own, GTK waits half a
      # minute at startup for desktop services that the runner's bus never starts.
      - name: Install and start (.deb)
        if: matrix.package == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./out/*.deb
          xvfb-run -a dbus-run-session -- scripts/smoke-test.sh /usr/bin/cortex-app

      - name: Start (AppImage)
        if: matrix.package == 'AppImage'
        env:
          # The runner has no FUSE; the AppImage unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo apt-get update
          # An AppImage leaves the graphics driver libraries to the system;
          # a desktop has them, the runner does not.
          sudo apt-get install -y xvfb libegl1 libgles2
          chmod +x out/*.AppImage
          xvfb-run -a dbus-run-session -- scripts/smoke-test.sh out/*.AppImage

      - name: Install and start (NSIS setup)
        if: matrix.package == 'nsis'
        shell: bash
        run: |
          # /S: silent. The installer returns before it is done unless waited for.
          powershell -Command 'Start-Process -Wait -FilePath (Get-Item out\*-setup.exe).FullName -ArgumentList "/S"'
          scripts/smoke-test.sh "$LOCALAPPDATA/Cortex/cortex-app.exe"

      - name: Install and start (.msi)
        if: matrix.package == 'msi'
        shell: bash
        run: |
          powershell -Command '$p = Start-Process -Wait -PassThru msiexec -ArgumentList "/i", (Get-Item out\*.msi).FullName, "/qn", "/norestart"; exit $p.ExitCode'
          scripts/smoke-test.sh "$PROGRAMFILES/Cortex/cortex-app.exe"

  sign:
    name: Sign the update packages
    needs: bundle
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tauri CLI from the lockfile, without install scripts
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          path: out
          pattern: installers-*
          merge-multiple: true

      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          shopt -s nullglob
          packages=(out/*.app.tar.gz out/*.AppImage out/*.msi out/*-setup.exe)
          [ "${#packages[@]}" -gt 0 ] || { echo "::error::no update packages"; exit 1; }
          for f in "${packages[@]}"; do
            # --app-version binds the signature to the version (requireSignedVersion).
            npx --no-install tauri signer sign --app-version "$version" "$f"
          done

      - name: The signatures match the key built into the app
        shell: bash
        run: |
          shopt -s nullglob
          node scripts/verify-update-signatures.mjs \
            out/*.app.tar.gz out/*.AppImage out/*.msi out/*-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: signatures
          path: out/*.sig
          if-no-files-found: error
          retention-days: 7

  release-files:
    name: Release files
    needs: [bundle, sign, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Update manifest
        working-directory: out
        run: |
          version="$(node -p "require('../src-tauri/tauri.conf.json').version")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          # One platform entry: the single file matching the pattern and its signature.
          entry() {
            set -- $1
            [ "$#" -eq 1 ] && [ -f "$1" ] && [ -f "$1.sig" ] || { echo "::error::missing update package: $*" >&2; return 1; }
            jq -n --arg url "$base/$1" --rawfile sig "$1.sig" '{url: $url, signature: ($sig | rtrimstr("\n"))}'
          }
          mac_arm="$(entry 'Cortex_aarch64-apple-darwin.app.tar.gz')"
          mac_x64="$(entry 'Cortex_x86_64-apple-darwin.app.tar.gz')"
          linux="$(entry '*.AppImage')"
          nsis="$(entry '*-setup.exe')"
          msi="$(entry '*.msi')"
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson mac_arm "$mac_arm" --argjson mac_x64 "$mac_x64" --argjson linux "$linux" \
            --argjson nsis "$nsis" --argjson msi "$msi" \
            '{version: $version, pub_date: $date, platforms: {
               "darwin-aarch64": $mac_arm, "darwin-x86_64": $mac_x64,
               "linux-x86_64-appimage": $linux,
               "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi}}' > latest.json
          cat latest.json

      - name: Checksums
        working-directory: out
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # What used to be checked by hand on the draft: nothing missing, nothing
      # extra, and a manifest that matches the files.
      - name: The release is complete and consistent
        shell: bash
        run: |
          shopt -s nullglob
          node scripts/verify-release.mjs out "$GITHUB_REPOSITORY"
          node scripts/verify-update-signatures.mjs \
            out/*.app.tar.gz out/*.AppImage out/*.msi out/*-setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: out/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft release
    needs: release-files
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # The only job that can write, and it runs no project code: it publishes
    # exactly the files the job before it checked.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft --verify-tag --generate-notes \
            --title "Cortex ${GITHUB_REF_NAME}"
