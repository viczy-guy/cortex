name: Release

# Pushing a tag `vX.Y.Z` builds the installers on the three platforms and
# attaches them, with their SHA-256 checksums, to a DRAFT GitHub release.
# A human reviews the draft and publishes it.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu: the binary links against its glibc and
          # so runs on every newer distribution.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the app version
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match app version ${version}"
            exit 1
          fi

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev pkg-config build-essential rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Bundle
        run: |
          npm ci
          npm run bundle -- --target ${{ matrix.target }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find "target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          ls -l out
          test -n "$(ls -A out)"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Draft release
    needs: bundle
    runs-on: ubuntu-latest
    # The only job that can write, and it runs no project code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: installers-*
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft --verify-tag --generate-notes \
            --title "Cortex ${GITHUB_REF_NAME}"
