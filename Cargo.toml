[workspace]
resolver = "2"
members = ["crates/cortex-core", "crates/cortex-hook", "src-tauri"]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/viczy-guy/cortex"
authors = ["viczy-guy"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: the hook installer must not reorder the user's settings keys.
serde_json = { version = "1", features = ["preserve_order"] }

# Smaller, faster release binaries (matters for cortex-hook startup time).
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
