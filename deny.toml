# cargo-deny policy — enforced in CI (see .github/workflows/ci.yml).
# A known vulnerability, an unknown source or an unapproved license fails the build.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities are always denied. Unmaintained-crate notices are surfaced
# for transitive deps we don't control but only fail for direct dependencies.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
# Only crates.io. No git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
